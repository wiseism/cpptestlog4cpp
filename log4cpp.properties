# 设置根日志的优先级为 INFO，并添加一个控制台和文件 Appender
log4cpp.rootCategory=INFO, stdout, fileout

# 配置控制台 Appender
log4cpp.appender.stdout=log4cpp::OstreamAppender
log4cpp.appender.stdout.layout=log4cpp::BasicLayout
log4cpp.appender.stdout.layout.ConversionPattern=%d{%Y-%m-%d %H:%M:%S} %-5p %c %x: %m%n
log4cpp.appender.stdout.ostream=std::cout

# 配置文件 Appender
log4cpp.appender.fileout=log4cpp::OstreamAppender
log4cpp.appender.fileout.fileName=myapp.log
log4cpp.appender.fileout.layout=log4cpp::BasicLayout
log4cpp.appender.fileout.layout.ConversionPattern=%d{%Y-%m-%d %H:%M:%S} %-5p %c %x: %m%n
log4cpp.appender.fileout.append=true