name: conan2 macos latest

on:
  push:
    branches: [ "conan2" ]
  pull_request:
    branches: [ "conan2" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: install conan2
        run: |
          brew install conan
          brew install gnu-sed
          export PATH="/opt/homebrew/opt/gnu-sed/libexec/gnubin:$PATH"
          conan profile detect
          echo "conan2 profiles"
          cat ~/.conan2/profiles/default
          gsed -i 's/Release/Debug/g' ~/.conan2/profiles/default
          echo "conan2 profiles"
          cat ~/.conan2/profiles/default

      - name: conan build
        run: |
          echo "cmake version"
          cmake --version
          #        mkdir temp
          #        cd temp
          #        wget -O cmake.tar.gz https://cmake.org/files/v3.24/cmake-3.24.4-linux-x86_64.tar.gz
          #        tar zxvf cmake.tar.gz -C ./
          #        export PATH=./temp/cmake-3.24.4-linux-x86_64/bin:$PATH
          #        echo "cmake --version"
          #        cmake --version
          #        cd ..
          conan install . --build=missing -pr=default
          cmake --preset conan-debug
          cmake --build ${{github.workspace}}/build/Debug --config ${{env.BUILD_TYPE}}  -j 2 --target testlibmysql